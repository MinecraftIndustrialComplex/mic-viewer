# cargo deny check licenses bans
# mic-viewer is MPL-2.0 like the host and the shared crates (mic-rtsim A7); dependencies must be
# permissive or MPL-2.0.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
]
confidence-threshold = 0.9
# Allowed licences not used yet stay allowed for future dependencies.
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates are publish = false.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
