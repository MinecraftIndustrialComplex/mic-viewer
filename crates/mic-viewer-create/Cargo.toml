[package]
name = "mic-viewer-create"
description = "Create 6's rail network, trains and factories for the viewer: create_tracks.dat and region block entities read on demand, drawn as marks with cards"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
repository = "https://github.com/MinecraftIndustrialComplex/mic-viewer"

[dependencies]
mic-viewer = { path = "../mic-viewer" }
mic-viewer-surveyor = { path = "../mic-viewer-surveyor" }
# Region chunks are zlib (or gzip) streams. MIT OR Apache-2.0; the versions the lock pins already.
flate2 = "1.1.10"
serde_json = "1.0.151"
